# Usage: cp .env.example .env  (edit it)  ->  docker compose up -d
services:
  landing-kit:
    build: .
    image: landing-kit:latest
    container_name: landing-kit
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
    # Only reachable from the host; put Caddy (or another reverse proxy) in front for HTTPS.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
